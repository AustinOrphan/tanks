<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>baseline trace</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; margin: 2rem; }
      .ok { color: #0a0 } .bad { color: #c00 }
      h2 { margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Tanks! baseline trace</h1>
    <!--
      Runs the golden trace (tools/baseline/trace.ts), the large-magnitude angle probe
      (tools/baseline/angles.ts, native Math.*) AND the vendored-math angle probe (same
      file, src/sim/math's detSin/detCos/detAtan2/detHypot -- issue #133) in whatever
      engine loaded this page, and prints all three fingerprints. tools/baseline/run.mjs
      drives it under Playwright and reads window.__traceResult / window.__angleResult /
      window.__vendoredAngleResult; open it by hand in any browser to get the same numbers
      from an engine Playwright does not ship (shipped Safari, iOS, a phone).

      MUST be served from localhost (or https): crypto.subtle is secure-context only.

      The three measurements are independent and each sets its own `window.*Result` only
      once it is fully built, same rule as before (a runner that polls for it can never
      read a half-filled object) -- adding a third measurement does not change what the
      others compute or when they are set.

      BEACON MODE (?beacon=<collector URL>): the driverless path for a browser we can only
      OPEN, not drive -- the iOS Simulator (tools/baseline/harness.mjs's
      startBeaconCollector, wired up by run.mjs's `--beacon` and engines.yml's iOS
      Simulator leg), a physical device, a kiosk browser. When the query param is present,
      once all three window.* results above are set this page POSTs them as one JSON body
      to that URL. The value must be a FULL url (e.g.
      `?beacon=http://localhost:5179/report`), not the literal `1` a first draft of this
      mechanism used: vite (which serves this page) only serves static files and ES
      modules, so a same-origin `./beacon` path has nothing to receive a POST -- the
      collector is a second, plain node:http server on its own port, and the browser must
      be told its exact address. The window.__* path above is completely unchanged by this
      -- beacon mode is additive, read only by a page that was asked for it.
    -->
    <h2>golden trace (tools/baseline/trace.ts)</h2>
    <pre id="trace-out">running... (a few seconds; the main thread is blocked while it simulates)</pre>
    <h2>angle probe (tools/baseline/angles.ts, native Math.*)</h2>
    <pre id="angle-out">running...</pre>
    <h2>vendored angle probe (tools/baseline/angles.ts, src/sim/math -- issue #133)</h2>
    <pre id="vendored-angle-out">running...</pre>
    <script type="module">
      import { traceText, sha256Hex, BASELINE_HASH } from '/tools/baseline/trace.ts';
      import {
        computeAngleBands, computeAngleHash, ANGLE_HASH,
        computeVendoredAngleBands, computeVendoredAngleHash, VENDORED_ANGLE_HASH,
      } from '/tools/baseline/angles.ts';

      const traceOut = document.getElementById('trace-out');
      const angleOut = document.getElementById('angle-out');
      const vendoredAngleOut = document.getElementById('vendored-angle-out');

      // ---- golden trace: unchanged from before this page grew a second measurement ----
      const traceStarted = performance.now();
      try {
        if (!globalThis.crypto?.subtle) {
          throw new Error(
            'crypto.subtle is unavailable -- this page must be served from localhost or over https',
          );
        }
        const text = traceText();
        const hash = await sha256Hex(text);
        const result = {
          hash,
          expected: BASELINE_HASH,
          match: hash === BASELINE_HASH,
          ms: Math.round(performance.now() - traceStarted),
          textLength: text.length,
          userAgent: navigator.userAgent,
        };
        traceOut.textContent =
          `${result.match ? 'MATCH' : 'MISMATCH'}\n` +
          `hash     ${result.hash}\n` +
          `expected ${result.expected}\n` +
          `chars    ${result.textLength}\n` +
          `took     ${result.ms} ms\n` +
          `ua       ${result.userAgent}`;
        traceOut.className = result.match ? 'ok' : 'bad';
        // Set LAST, so a runner that polls for it can never read a half-filled object.
        window.__traceResult = result;
      } catch (e) {
        const result = { error: String(e?.stack ?? e), userAgent: navigator.userAgent };
        traceOut.textContent = `FAILED\n${result.error}`;
        traceOut.className = 'bad';
        window.__traceResult = result;
      }

      // ---- angle probe: same shape, its own measurement, its own bands for diagnosis ----
      const angleStarted = performance.now();
      try {
        if (!globalThis.crypto?.subtle) {
          throw new Error(
            'crypto.subtle is unavailable -- this page must be served from localhost or over https',
          );
        }
        const bands = await computeAngleBands();
        const hash = await computeAngleHash(bands);
        const result = {
          hash,
          expected: ANGLE_HASH,
          match: hash === ANGLE_HASH,
          ms: Math.round(performance.now() - angleStarted),
          bands: bands.map((b) => ({ name: b.name, count: b.count, hash: b.hash })),
          userAgent: navigator.userAgent,
        };
        angleOut.textContent =
          `${result.match ? 'MATCH' : 'MISMATCH'}\n` +
          `hash     ${result.hash}\n` +
          `expected ${result.expected}\n` +
          `bands    ${result.bands.length}\n` +
          `took     ${result.ms} ms\n` +
          `ua       ${result.userAgent}`;
        angleOut.className = result.match ? 'ok' : 'bad';
        // Set LAST, same rule as window.__traceResult above.
        window.__angleResult = result;
      } catch (e) {
        const result = { error: String(e?.stack ?? e), userAgent: navigator.userAgent };
        angleOut.textContent = `FAILED\n${result.error}`;
        angleOut.className = 'bad';
        window.__angleResult = result;
      }

      // ---- vendored angle probe: same shape again, issue #133's src/sim/math sweep -----
      const vendoredAngleStarted = performance.now();
      try {
        if (!globalThis.crypto?.subtle) {
          throw new Error(
            'crypto.subtle is unavailable -- this page must be served from localhost or over https',
          );
        }
        const bands = await computeVendoredAngleBands();
        const hash = await computeVendoredAngleHash(bands);
        const result = {
          hash,
          expected: VENDORED_ANGLE_HASH,
          match: hash === VENDORED_ANGLE_HASH,
          ms: Math.round(performance.now() - vendoredAngleStarted),
          bands: bands.map((b) => ({ name: b.name, count: b.count, hash: b.hash })),
          userAgent: navigator.userAgent,
        };
        vendoredAngleOut.textContent =
          `${result.match ? 'MATCH' : 'MISMATCH'}\n` +
          `hash     ${result.hash}\n` +
          `expected ${result.expected}\n` +
          `bands    ${result.bands.length}\n` +
          `took     ${result.ms} ms\n` +
          `ua       ${result.userAgent}`;
        vendoredAngleOut.className = result.match ? 'ok' : 'bad';
        // Set LAST, same rule as window.__traceResult/window.__angleResult above.
        window.__vendoredAngleResult = result;
      } catch (e) {
        const result = { error: String(e?.stack ?? e), userAgent: navigator.userAgent };
        vendoredAngleOut.textContent = `FAILED\n${result.error}`;
        vendoredAngleOut.className = 'bad';
        window.__vendoredAngleResult = result;
      }

      // ---- beacon mode: POST the three results to a collector on another origin -------
      // See the header comment above for why the value must be a full URL. All three
      // window.__*Result values are guaranteed set by this point (each block above sets
      // its own before falling through to the next).
      const beaconUrl = new URLSearchParams(location.search).get('beacon');
      if (beaconUrl) {
        const beaconOut = document.createElement('pre');
        try {
          const res = await fetch(beaconUrl, {
            method: 'POST',
            mode: 'cors',
            keepalive: true,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              traceResult: window.__traceResult,
              angleResult: window.__angleResult,
              vendoredAngleResult: window.__vendoredAngleResult,
              userAgent: navigator.userAgent,
            }),
          });
          beaconOut.textContent = res.ok ? `beacon: reported to ${beaconUrl}` : `beacon: collector returned HTTP ${res.status}`;
          beaconOut.className = res.ok ? 'ok' : 'bad';
        } catch (e) {
          // Surface on the page itself: a phone or the Simulator has no attached console.
          beaconOut.textContent = `beacon: POST to ${beaconUrl} failed -- ${e?.message ?? e}`;
          beaconOut.className = 'bad';
        }
        document.body.appendChild(beaconOut);
      }
    </script>
  </body>
</html>
