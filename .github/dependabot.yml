# Automated dependency update hygiene (issue #762). Policy and review rules:
# docs/agent/commands-and-operations.md, "Dependency updates".
#
# Low noise by construction: one weekly run per ecosystem, a week of cooldown before a new
# release is proposed, routine tooling updates grouped, and at most five open update pull
# requests per ecosystem. Nothing here merges anything: every update pull request runs the
# normal required checks and waits for a human.
version: 2
updates:
  - package-ecosystem: npm
    # The root, and through the root package.json's `workspaces` the tools/mutate workspace
    # too: Dependabot's npm fetcher reads every workspace package.json from the root and
    # updates the one root package-lock.json.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    # Range and lockfile move together, so package.json always states the version CI tested.
    versioning-strategy: increase
    cooldown:
      default-days: 7
      semver-major-days: 14
    labels:
      - area:repository
    groups:
      # Routine tooling: minor and patch updates to devDependencies, one pull request a week.
      # Majors are never grouped with other packages; each arrives alone.
      tooling-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@types/three'
          - '@types/howler'
      # A runtime dependency never shares a pull request with tooling, only with its own type
      # definitions, so the types can never run ahead of or behind the library they describe.
      # `three` is 0.x, where every minor can change rendering.
      three:
        patterns:
          - three
          - '@types/three'
      howler:
        patterns:
          - howler
          - '@types/howler'
    ignore:
      # The Node type definitions follow the SUPPORTED FLOOR (engines: ^22.13.0 || ^24.0.0),
      # not the newest Node. Types for a newer major would let code call APIs the floor lacks,
      # which raises the floor without anyone deciding to. Raise this bound with the floor.
      - dependency-name: '@types/node'
        versions:
          - '>=23'
      # TypeScript 7 removes the JavaScript compiler API that tools/hud-closure
      # (npm run hud:closure) is built on, so the tool and its test fail to load (#802).
      # TypeScript 6 still has the API. Held until the tool is ported (#807); remove this entry
      # in that pull request.
      - dependency-name: typescript
        versions:
          - '>=7'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - area:repository
    groups:
      # Every workflow references first-party actions/* by major tag, so an update here is a
      # tag bump across the workflows that use it; one pull request carries them all.
      actions:
        patterns:
          - '*'
