name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the required gate (verify (floor), verify (current), visual -- the ruleset's
  # required status checks) be run against a branch without opening a PR. Adds no new
  # trigger surface beyond that: push and pull_request are unchanged, and this path
  # has no fork-PR or workflow_run ambiguity to guard against, unlike pages.yml's.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Semantic names keep the required-check contexts stable when supported Node
    # versions advance; the ruleset should require verify (floor) and verify (current).
    name: verify (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the declared supported floor. Pin it exactly so CI tests the
        # claim in package.json, and pair it with the Node 24 LTS line so a
        # version-specific break cannot hide behind the minimum runtime.
        include:
          - label: floor
            node: '22.13.0'
          - label: current
            node: '24'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs strictly from the
      # lockfile and fails if the two have drifted, which is the same clean
      # checkout a deploy would build from.
      - run: npm ci

      # Keep these as atomic named steps rather than one composite command: each
      # failure's diagnostic boundary stays visible, while package.json remains
      # the one command source of truth.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:unit

      # The floor lane already runs tools/mutate/orchestrate.test.ts in the unit suite,
      # including real Vitest subprocess, file-mutation and restore cases. This selected
      # real manifest entry adds the CLI, git-cleanliness, reachability, baseline,
      # apply/test/restore and declared-outcome path without duplicating the full manifest.
      - name: Mutation harness smoke (floor)
        if: matrix.label == 'floor'
        run: npm run mutate:smoke

      # tools/mutate/manifest.json is hand-verified against a specific commit, and this
      # repo's own history has that go stale: a rebase onto a later main left two `find`
      # strings no longer matching and one declared outcome flipped. Node 24 is the
      # authoritative per-change full-manifest lane; mutation-floor.yml separately runs
      # the same complete manifest daily and on request under exact Node 22.13.0.
      # `--jobs auto` is the worktree pool (issue #502): one serial harness per detached
      # worktree, three at a time on this four-core runner, same outcomes as serial.
      - name: Mutation manifest (full, current)
        if: matrix.label == 'current'
        run: npm run mutate -- --jobs auto

      - name: Build
        run: npm run build

      # The base-path regression guard. A bundle built with the default base
      # references /assets/... absolutely and is a blank page on any host that
      # is not a domain root -- which a passing unit test cannot detect, since
      # Vitest resolves BASE_URL to '/' regardless of the build config.
      #
      # This used to be an inline shell block, duplicated here and in pages.yml.
      # It is now tools/portability/check.mjs, for two reasons measured rather
      # than assumed: the shell version PASSED on a dist/ with no JavaScript at
      # all (grep exits 2 on a non-matching glob, and `!` inverts that to 0),
      # and its second clause matched double-quoted paths only -- vite 8
      # minifies the same source to a backtick template, so it had quietly
      # stopped catching anything when the toolchain moved. The checker has its
      # own negative controls in tools/portability/check.test.ts.
      - name: Assert the build is subpath-portable
        run: npm run portability

      # Dev-only advisories (vite/vitest dev-server CVEs) cannot reach a static
      # bundle, so gating on them would be a permanent, non-actionable red.
      - name: Audit production dependencies
        run: npm run audit:prod

  # The visual check runs as its own job, not as a step in `verify`.
  #
  # It needs a browser, which is a ~130MB download and roughly a minute the unit
  # suite does not need, and it is the only thing here that can fail for reasons
  # unrelated to the code -- a renderer difference between this runner and a
  # developer's machine. Keeping it separate means a failure says which of the
  # two kinds of thing broke, and the fast feedback from `verify` is not held up
  # behind a browser install.
  #
  # Playwright is deliberately NOT a devDependency: the package downloads
  # browsers on install, which would cost every developer and every `verify` job
  # for a tool only this job runs. It is installed here with --no-save.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Pin the version so the cache key below is meaningful, and so a
      # playwright bump is a visible diff rather than a silent drift.
      - name: Install Playwright
        run: npm i --no-save playwright@1.62.0

      # The browser is ~130MB and does not change between runs; only a version
      # bump should re-download it.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.0-${{ runner.os }}

      # NOT --with-deps. That shells out to apt-get, and on one run it took
      # 9m55s against 49s for the same job on the two runs before it -- the
      # variance is the package mirror, not anything this repo controls. The
      # ubuntu-latest image already carries chromium's shared libraries, so the
      # browser download alone is enough. If a future runner image drops them,
      # this step fails loudly with a missing-library error, which is a better
      # failure than a ten-minute wait.
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      # Measures the SCREENSHOT, never the WebGL canvas directly -- reading the
      # canvas with drawImage returns all black without preserveDrawingBuffer,
      # which is how an earlier harness reported a black screen for a game that
      # was rendering fine. See tools/visual/README.md.
      # scene.ts builds a WebGLRenderer, so vitest cannot construct it -- that
      # single fact is why framing.ts was carved out of it, and why everything
      # left behind stayed untested while BOTH shipped visual defects lived
      # there. This job already has chromium, so those tests run here.
      - name: GL tests (scene.ts)
        run: npm run test:gl

      # The golden trace, run in the browser this job already has. `npm run test:unit` in
      # the `verify` job pins the same hash under Node, so this is not about catching a
      # sim change -- it is about tools/baseline/{page.html,run.mjs} not rotting unread,
      # which is how hud.css lost a brace for the life of a feature. It also means a
      # divergence between Node and V8 would surface here rather than at netcode time.
      # ~5 seconds.
      - name: Baseline trace (chromium)
        run: npm run trace:browser

      - name: Visual check
        run: npm run visual -- --out visual-out

      # The SESSION LIFECYCLE, which no screenshot can see (issues #429, #480). Every one of
      # #428's four start gestures is started and quit, and the canvas/live-context census is
      # read off the document after each. `renderer.forceContextLoss()` means a leaked
      # gameplay canvas is indistinguishable from a live one in the unit fakes -- a real
      # browser is the only place it shows. Runs here because this job already has chromium
      # and a built `dist`, so it adds only its own runtime: 23.1 s measured ON THIS RUNNER
      # (2026-09-01, ubuntu-latest, PR #481's own run -- 17:12:37.6 to 17:13:00.7), against
      # this job's ~130 MB browser install. Four real matches at 60 Hz is most of it. A local
      # Linux box under swiftshader took 40.0/40.3/40.8 s (n=3), so the runner is the faster
      # of the two and the local figure is the pessimistic one.
      - name: Session lifecycle round trip
        run: npm run roundtrip

      # The numbers alone do not tell you WHAT went wrong; the screenshots do.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-output
          path: visual-out/
          retention-days: 14
