# Cross-OS / cross-engine determinism matrix -- reports, does not gate.
#
# WHY THIS IS ITS OWN WORKFLOW, NOT A JOB IN ci.yml: pages.yml deploys on `workflow_run`
# for the workflow named `CI`, gated on `github.event.workflow_run.conclusion == 'success'`
# (CLAUDE.md, "The deploy waits for CI"). That conclusion is the CI WORKFLOW's overall
# result, so a red job anywhere inside ci.yml -- for any reason -- stops the site
# publishing. CLAUDE.md already documents what that costs when the red job can fail for
# reasons unrelated to the tree: "A flaky `visual` now stops the site updating... the
# symptom is a pages run with every job SKIPPED, not a red run." macos-latest and
# windows-latest are runner classes this repo has never exercised; a first-run flake on
# either (a slow package mirror during browser install, a runner image quirk) is exactly
# that failure mode, and it must not be able to hold the deploy hostage over nothing the
# tree did. So this workflow lives outside `ci.yml`'s name entirely -- pages.yml's trigger
# only matches workflows named `CI`, so nothing here can ever be in that gate, red or green.
# `main` also carries no branch protection (CLAUDE.md), so this was a deliberate placement
# choice, not a gap plugged by some other mechanism.
#
# WHAT IT MEASURES: tools/baseline/run.mjs's golden trace (tools/baseline/trace.ts,
# BASELINE_HASH), large-magnitude angle probe (tools/baseline/angles.ts, ANGLE_HASH) and
# vendored-math angle probe (same file, VENDORED_ANGLE_HASH -- issue #133), across axes
# ci.yml's ubuntu-only runners cannot reach -- macOS (the closest available proxy to
# shipped Safari: Playwright webkit there is still JavaScriptCore, not shipped Safari, but
# closer than the Linux build ci.yml already runs), arm64 (macos-latest runners are
# arm64), and Windows. PR #160 measured chromium/firefox/webkit already diverging on
# sin/cos/atan2/hypot on Linux x86-64 while the golden trace still agrees (a lattice
# artifact -- see angles.ts's header); this workflow is the harness that finds out whether
# that picture changes on a different OS or CPU. **#133 landed against this exact
# harness**: on Linux x86-64 chromium/firefox/webkit all produced the same
# VENDORED_ANGLE_HASH, and a mismatch there IS wired into run.mjs's exit code (unlike a
# native ANGLE_HASH mismatch, which stays structural and unfixable) -- so this workflow is
# what extends that same cross-engine agreement check to macOS (arm64) and Windows, not a
# forward reference to work that hasn't landed yet. It still prints and uploads all three
# hashes per (os, engine).
#
# TWO MORE JOBS below close the gap this file's own header used to call permanently open:
# "the Safari/iOS half of the question stays OPEN however this exits" (run.mjs's old
# wording). `safari-leg` drives SHIPPED Safari via `safaridriver` (Apple's own WebDriver,
# raw-HTTP client in tools/baseline/safari.mjs -- no new npm dependency). `ios-simulator-leg`
# opens tools/baseline/run.mjs's new `--beacon` mode in a real iOS Simulator via `xcrun
# simctl openurl`, the driverless mechanism page.html/harness.mjs grew for exactly this
# (any browser you can merely open, not drive). Both are BRAND NEW and have never run on a
# real macOS runner from this Linux dev box -- see each job's own comments for what is
# proven only by their first execution. Both are separate top-level jobs with no `needs:`
# on `engines` above (and nothing depends on them), so GitHub Actions runs and reports them
# independently: a first-run flake in either cannot fail or cancel the 3-OS matrix job.
name: Engines matrix

on:
  push:
    branches: [main]
  # Weekly rather than only push-triggered: a runner-image or browser-mirror regression on
  # one OS should not need a commit to this repo before anyone notices it.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    name: engines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous: browser install dominates, not the harness (the trace itself runs in
    # ~15s total on Linux locally). `playwright install-deps` shells out to apt-get, and
    # that has been measured elsewhere in this repo taking up to ~10 minutes on a bad
    # mirror day for chromium ALONE (ci.yml's `visual` job comment, from `--with-deps`) --
    # three browsers, and two OSes this repo has never run on at all, get real headroom
    # rather than a guess.
    timeout-minutes: 30
    strategy:
      # One OS failing (a runner flake, a mirror timeout) must not cancel the other two --
      # the whole point of this workflow is to see each axis independently.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pw-cache-path: ~/.cache/ms-playwright
          - os: macos-latest
            pw-cache-path: ~/Library/Caches/ms-playwright
          - os: windows-latest
            pw-cache-path: ~\AppData\Local\ms-playwright
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Same pin as ci.yml's `visual` job, and for the same reason: a fixed version makes
      # the cache key below meaningful and a Playwright bump a visible diff rather than
      # silent drift. Not a devDependency for the same reason as ci.yml: it downloads
      # browsers on install, a cost only this workflow (and `visual`) should pay.
      - name: Install Playwright
        run: npm i --no-save playwright@1.62.0

      # ci.yml's `visual` job caches ~/.cache/ms-playwright keyed on runner.os -- that path
      # is Linux-only. Playwright's own cache root differs per OS (Linux:
      # ~/.cache/ms-playwright, macOS: ~/Library/Caches/ms-playwright, Windows:
      # ~\AppData\Local\ms-playwright), hence the per-OS path in the matrix rather than one
      # literal path. All three browsers share one cache root, so one cache entry covers
      # chromium+firefox+webkit together.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.pw-cache-path }}
          key: playwright-all-1.62.0-${{ runner.os }}

      # Binaries only, gated on the cache exactly like ci.yml's `visual` job. On Linux this
      # is deliberately SEPARATE from the system-library install below: the two live in
      # different places, and folding them into one step gated on cache-hit was tried first
      # and is wrong -- see that step's comment.
      - name: Install browsers (Linux)
        if: runner.os == 'Linux' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      # NOT gated on cache-hit. apt's system libraries firefox/webkit need beyond what
      # ubuntu-latest ships (ci.yml's `visual` job only skips this for chromium ALONE,
      # which the image already carries -- firefox/webkit are a different claim) live under
      # /usr, not in ~/.cache/ms-playwright, so a cache HIT restores the browser binaries but
      # not the libraries -- an ephemeral runner never keeps apt state between jobs. Gating
      # this on cache-hit the same way as the binaries would make every run after the first
      # (a cache miss, which installs deps as a side effect of --with-deps) launch webkit
      # against missing libraries and fail. `install-deps` is idempotent -- safe, and fast,
      # to run on a runner that already has them -- so it runs every Linux job unconditionally.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit

      # macOS and Windows installs are self-contained (no separate OS-package step), so
      # gating on the binary cache alone is correct there.
      - name: Install browsers (macOS/Windows)
        if: runner.os != 'Linux' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      # tools/baseline/run.mjs already prints every engine's golden-trace hash and angle
      # hash (MATCH/MISMATCH lines) and exits non-zero on a GOLDEN TRACE mismatch against
      # the pinned BASELINE_HASH, or on a hard tool failure -- verified by reading run.mjs:
      # `if (!r.match) failed++` for the trace, gating this step and therefore this job. An
      # ANGLE hash mismatch does NOT flip `failed` (see run.mjs's angle-probe reporting
      # block and angles.ts's header): it is a structural, already-measured disagreement
      # (PR #160), not a regression, so it must not turn a reporting-only job red either.
      # `shell: bash` (not the platform default, which is pwsh on Windows) so `tee` and
      # pipefail behave the same on all three runners -- GitHub Actions invokes `bash` with
      # `-eo pipefail` by default, and `set -o pipefail` is kept explicit here so the step
      # still fails correctly on the trace exit code even if that default ever changes.
      - name: Run the golden trace + angle probe (all engines)
        shell: bash
        run: |
          set -o pipefail
          npm run trace:browser -- --all 2>&1 | tee "trace-${{ runner.os }}.log"

      # Per-OS artifact name so all three logs -- and both hashes each contains -- are
      # diffable side by side without scrolling three separate job logs. `if: always()`:
      # the log is exactly as useful when the step above failed.
      - name: Upload trace output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-trace-${{ runner.os }}
          path: trace-${{ runner.os }}.log
          retention-days: 90

  # SHIPPED Safari, not Playwright's JavaScriptCore "webkit" build above. safaridriver only
  # exists on macOS and needs a one-time, privileged enable step before it will accept a
  # session -- done here, not inside safari.mjs, since it needs `sudo` and this job is the
  # only caller.
  #
  # FIRST RUN ON A REAL RUNNER: this job has never executed outside this Linux dev box's
  # simulation (a mock WebDriver server, see tools/baseline/safari.test.ts). safaridriver's
  # actual startup timing, whether `{browserName: 'safari'}` alone is a sufficient
  # capability, and the exact shape of a real session's `capabilities` object are all
  # unproven until this job runs for real -- expect iteration. It is its own job (no
  # `needs:`, nothing depends on it) for exactly that reason: a flake here must not fail
  # `engines` above or cancel it via fail-fast.
  safari-leg:
    name: Safari (safaridriver, real macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # One-time, privileged: without this, safaridriver refuses every session with a
      # permission error. Idempotent -- safe to run on every job invocation.
      - name: Enable safaridriver
        run: sudo safaridriver --enable

      # safari.mjs prints Safari's own version (from the WebDriver session's capabilities)
      # and applies run.mjs's own reportResult exit-code semantics (tools/baseline/
      # harness.mjs): a golden-trace or vendored-angle MISMATCH fails this step; a native
      # angle-probe MISMATCH is reported but does not, matching every other leg in this
      # workflow.
      - name: Run the golden trace + angle probe (Safari)
        run: node tools/baseline/safari.mjs 2>&1 | tee trace-safari.log

      - name: Upload trace output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-trace-safari
          path: trace-safari.log
          retention-days: 90

  # Real iOS WebKit, on the runner's own arm64 -- the other half of "shipped Safari and iOS
  # stay open" that Playwright's engines (including its webkit) cannot reach at all. Uses
  # `--beacon` mode (mechanism 1: tools/baseline/harness.mjs's startBeaconCollector, wired
  # into page.html and run.mjs) rather than a driver: there is no iOS WebDriver equivalent
  # to safaridriver that this workflow can reach, so the Simulator is instead simply OPENED
  # at the right URL and left to report back on its own, the same trick a physical device
  # would use.
  #
  # FIRST RUN ON A REAL RUNNER: this job has never executed outside this Linux dev box's
  # simulation (a real Playwright chromium standing in for "any browser we can merely open"
  # -- see tools/baseline/beacon-check.mjs). The load-bearing ASSUMPTION, unverified until
  # this job runs for real, is that Mobile Safari inside the iOS Simulator shares the
  # HOST's own loopback interface, so the `http://localhost:<port>` URLs run.mjs prints
  # (unchanged from its normal local usage) are reachable from inside the Simulator exactly
  # as from the host -- no `--host`/LAN address needed. If that assumption is wrong, the
  # fix is to pass `--host` and swap the printed URL's host for the LAN address run.mjs
  # already computes for that case (see run.mjs's own comment on why LAN is best-effort:
  # crypto.subtle needs a secure context, which plain http://<lan-ip> is not). Also
  # unproven: exact `xcrun simctl` timing and CLI surface on this runner image. Its own job,
  # same reasoning as safari-leg above: a flake here cannot fail `engines` or cancel it.
  ios-simulator-leg:
    name: iOS Simulator (beacon, Mobile Safari)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pick and boot a simulator
        run: |
          set -euo pipefail
          UDID=$(node tools/baseline/find-simulator.mjs)
          echo "picked simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b

      # run.mjs --beacon backgrounds itself here so this step can extract the BEACON_URL it
      # prints (only after vite is confirmed serving THIS checkout's page.html) and hand it
      # to the Simulator; `wait` on the backgrounded PID afterwards is what makes this
      # step's exit code the trace's real pass/fail, not just "did we manage to open a URL".
      - name: Open the beacon URL in the Simulator and wait for its report
        shell: bash
        run: |
          set -euo pipefail
          node tools/baseline/run.mjs --beacon --timeout 180000 > beacon-ios.log 2>&1 &
          RUNNER_PID=$!
          URL=""
          for i in $(seq 1 60); do
            if grep -q '^BEACON_URL ' beacon-ios.log 2>/dev/null; then
              URL=$(grep '^BEACON_URL ' beacon-ios.log | head -1 | cut -d' ' -f2-)
              break
            fi
            if ! kill -0 "$RUNNER_PID" 2>/dev/null; then
              echo "run.mjs --beacon exited before printing a URL"; cat beacon-ios.log; exit 1
            fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "beacon collector never printed a URL within 60s"; cat beacon-ios.log
            kill "$RUNNER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "opening $URL in simulator $SIM_UDID"
          xcrun simctl openurl "$SIM_UDID" "$URL"
          set +e
          wait "$RUNNER_PID"
          EXIT=$?
          set -e
          cat beacon-ios.log
          exit $EXIT

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "$SIM_UDID" || true

      - name: Upload trace output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-trace-ios-simulator
          path: beacon-ios.log
          retention-days: 90
