<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes `env(safe-area-inset-*)` mean anything: without
         it the browser insets the viewport itself and every inset reads as 0px, so the
         HUD rules in hud.css that reference them silently fall back to their base
         spacing. With it, the page owns the full display and the HUD does the insetting
         -- which is the only arrangement in which the board is drawn edge to edge and
         the Fire/Mine buttons still clear the home-indicator strip. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tanks!</title>
    <meta
      name="description"
      content="A top-down arena tank game: ricochet shells, mines, and three enemy personalities."
    />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Absolute, unlike every other URL-bearing tag below it in this file: canonical and
         Open Graph URLs are read by crawlers and link-unfurlers off-origin, not resolved
         by a browser that already has /tanks/ as its base, so the relative-href rule the
         favicon/manifest/icon comments describe does not apply here. This is the one
         live location the game is served from. -->
    <link rel="canonical" href="https://austinorphan.com/tanks/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://austinorphan.com/tanks/" />
    <meta property="og:title" content="Tanks!" />
    <!-- Same sentence as the description meta above, deliberately: one honest description
         of the game, not a second copy that could drift from the first. -->
    <meta
      property="og:description"
      content="A top-down arena tank game: ricochet shells, mines, and three enemy personalities."
    />
    <!-- No og:image/twitter:image: no share-image asset exists in this repo yet, and a
         summary card renders fine without one. Inventing a placeholder file here would be
         worse than omitting the tag; adding a real one is deferred, tracked separately
         from this change. -->
    <meta name="twitter:card" content="summary" />
    <!-- Relative href, deliberately: on a GitHub Pages PROJECT page the browser
         resolves a bare /favicon.ico against the ORIGIN root, not the project
         subpath, so dropping a file in public/ is not enough on its own. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Same relative-href rule as the favicon above, and it bites harder here: the
         manifest's own `start_url` and `scope` resolve against the MANIFEST's URL, so an
         origin-absolute href would install a shortcut that opens austinorphan.com's root
         (the portfolio) rather than /tanks/. `tools/portability/check.mjs` asserts both
         against the BUILT output.

         Deliberately no service worker: CLAUDE.md records that the portfolio's
         root-scoped /sw.js already controls /tanks/ and deletes every CacheStorage entry
         it does not own, so offline caching needs coordination outside this repo -- and
         the bundle makes no network requests after load, so it would buy little. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS reads neither the manifest's icons nor an SVG favicon for Add to Home
         Screen; this PNG is the only icon it will use. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        /* Pull-to-refresh and the horizontal back-swipe both begin as a drag on the
         * board, which is also how the tank is driven. */
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /*
       * touch-action: none is what makes the virtual thumbstick work AT ALL, and it is
       * not a nicety.
       *
       * Left at the default, the browser treats a drag on the canvas as a candidate pan
       * or pinch: measured on a Pixel 5, a vertical drive drag produced pointerdown, TWO
       * pointermoves and then pointercancel, after which no further pointermove is
       * delivered for that finger -- so the stick died about where it first left the
       * dead zone, and could not restart without lifting. A horizontal drag was
       * cancelled after 16px. Two thumbs moving apart -- the normal posture of a
       * twin-stick -- zoomed the page to 4.25x and cancelled both.
       *
       * Scoped to the canvas rather than set globally, so the HUD's own scrollable
       * panes (the achievements list) keep their gestures. The buttons set
       * `touch-action: manipulation` for the same reason at a smaller scale.
       */
      canvas {
        display: block;
        touch-action: none;
      }
      /*
       * The first thing on screen, and the last thing issue #325 calls "initial loading".
       * Before it, `#app` was empty and the document background was the whole experience
       * until the module graph evaluated -- indistinguishable, on a slow connection or a
       * failed deploy, from a broken page.
       *
       * Inline HERE rather than in hud.css, because hud.css arrives with the bundle and
       * this has to be painted by the markup alone. `boot.ts` removes the element once
       * the route UI exists, and the failure screen clears the root, so it is never
       * competing with either.
       *
       * No spinner and no animation: a static wordmark says the same thing, needs no
       * reduced-motion exception, and cannot keep animating over a page that has died.
       */
      #boot-loading,
      #boot-noscript {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-sizing: border-box;
        color: #d8dde6;
        font: 600 1.5rem/1.6 system-ui, sans-serif;
        text-align: center;
      }
      #boot-noscript {
        font-weight: 400;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Removed by boot.ts once the route UI exists (issue #325). Present in the
           markup rather than written by script, because the gap it covers is the one
           before any script has run. -->
      <div id="boot-loading">Tanks!</div>
      <!-- The one failure the bundle can never report on its own, so the markup must
           (issue #325): with scripting off, nothing below ever runs and the page would
           otherwise sit blank and dark with no explanation at all. -->
      <noscript>
        <!--
          The holding card is retired by `boot.ts`, which never runs here, so without this
          rule the two states stack: both are `position:absolute; inset:0`, and the
          "Tanks!" wordmark lands on top of the sentence explaining why nothing works.
          Measured, not predicted -- the capture for issue #325 showed both, overlapping
          and unreadable, and no assertion about the markup could see it because both
          elements were present exactly as intended.

          A <style> inside <noscript> is the one way to say "only when scripting is off"
          in CSS; there is no media query for it.
        -->
        <style>
          #boot-loading {
            display: none;
          }
        </style>
        <div id="boot-noscript">
          Tanks! needs JavaScript, which is turned off in this browser. Enable it for this
          page, or open the game in another browser.
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
