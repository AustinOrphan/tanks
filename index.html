<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanks!</title>
    <meta
      name="description"
      content="A top-down arena tank game: ricochet shells, mines, and three enemy personalities."
    />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Relative href, deliberately: on a GitHub Pages PROJECT page the browser
         resolves a bare /favicon.ico against the ORIGIN root, not the project
         subpath, so dropping a file in public/ is not enough on its own. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
